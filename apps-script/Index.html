<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPMO Pro - Hệ Thống Thi Trắc Nghiệm Google Apps Script</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#090d16',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Mammoth for Word docx in Apps Script client -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col justify-between selection:bg-cyan-500/30">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-4 sm:px-8 py-3.5 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-black text-white text-base shadow-lg shadow-cyan-500/20">
        S
      </div>
      <div>
        <div className="flex items-center gap-2">
          <span class="font-extrabold text-base sm:text-lg text-slate-100">SPMO Pro</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            GOOGLE APPS SCRIPT
          </span>
        </div>
        <p class="text-[11px] text-slate-400 hidden sm:block">Đồng bộ tự động với Google Sheets & Bảng điểm trực tuyến</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="btnAdminLogin" onclick="openAdminModal()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700 transition-all">
        <i data-lucide="key" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span>Quản Trị (Admin)</span>
      </button>
      <button id="btnExitAdmin" onclick="exitAdminView()" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs font-bold border border-rose-500/40 transition-all">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Về trang thi</span>
      </button>
    </div>
  </header>

  <!-- Container -->
  <main id="appContainer" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex items-center justify-center">
    <!-- Dynamic View Injected Here -->
  </main>

  <!-- Footer -->
  <footer class="py-3 px-4 text-center text-xs text-slate-500 border-t border-slate-900">
    SPMO Pro © 2026 - Tích hợp Google Sheets & Google Apps Script
  </footer>

  <!-- Admin Password Modal -->
  <div id="adminModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl relative">
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 p-1 text-slate-500 hover:text-slate-300">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div class="w-12 h-12 rounded-2xl bg-cyan-500/15 border border-cyan-500/30 flex items-center justify-center text-cyan-400 mb-3">
        <i data-lucide="key" class="w-6 h-6"></i>
      </div>
      <h3 class="text-lg font-black text-slate-100">Đăng Nhập Quản Trị</h3>
      <p class="text-xs text-slate-400 mb-4">Nhập mật khẩu để quản lý phòng thi và Google Sheet</p>
      <div class="space-y-3">
        <input type="password" id="adminPasswordInput" placeholder="Mật khẩu (mặc định: admin)" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
        <div id="adminError" class="hidden text-xs text-rose-400 font-semibold">Mật khẩu không chính xác!</div>
        <button onclick="checkAdminPassword()" class="w-full py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-sm shadow-lg shadow-cyan-600/30">
          Xác Nhận
        </button>
      </div>
    </div>
  </div>

  <script>
    // State Store
    let APP_STATE = {
      rooms: [
        { roomCode: 'SPM-2026', roomName: 'Kỳ Thi Nâng Bậc Nghề Đợt 1', accessPin: '8899', isLocked: true, examTimeMinutes: 60, totalQuestions: 50 },
        { roomCode: 'AT-Q1', roomName: 'Sát Hạch An Toàn Quý 1', accessPin: '1234', isLocked: false, examTimeMinutes: 45, totalQuestions: 40 }
      ],
      candidates: [],
      questions: [
        {
          id: '1', question: 'Khi thực hiện công việc có cắt điện tại trạm biến áp, thứ tự thực hiện các biện pháp kỹ thuật an toàn chuẩn xác là:',
          options: {
            A: 'Cắt điện -> Đặt tiếp đất -> Kiểm tra không còn điện -> Treo biển báo, rào chắn',
            B: 'Cắt điện -> Kiểm tra không còn điện -> Đặt tiếp đất -> Treo biển báo, rào chắn',
            C: 'Kiểm tra không còn điện -> Cắt điện -> Đặt tiếp đất -> Treo biển báo',
            D: 'Đặt tiếp đất -> Cắt điện -> Kiểm tra không còn điện -> Treo biển báo'
          },
          correct: 'B', section: 'AT', citation: 'Quy trình An toàn điện - Điều 18'
        },
        {
          id: '2', question: 'Khoảng cách an toàn tối thiểu đối với người đến phần mang điện cấp điện áp 110kV khi không có rào chắn là bao nhiêu?',
          options: { A: '0.7 mét', B: '1.0 mét', C: '1.5 mét', D: '2.0 mét' },
          correct: 'C', section: 'AT', citation: 'Quy chuẩn QCVN 01:2020/BCT'
        }
      ],
      currentExam: null,
      currentAnswers: {},
      currentQuestionIndex: 0,
      remainingSeconds: 3600,
      timerInterval: null,
      focusViolations: 0,
      isAdmin: false
    };

    // Initialize from Google Apps Script if available
    window.addEventListener('load', function() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(data) {
            if (data.rooms && data.rooms.length) APP_STATE.rooms = data.rooms;
            if (data.candidates) APP_STATE.candidates = data.candidates;
            if (data.questions && data.questions.length) APP_STATE.questions = data.questions;
            renderCandidatePortal();
          })
          .apiGetInitialData();
      } else {
        renderCandidatePortal();
      }
    });

    // View 1: Candidate Portal
    function renderCandidatePortal() {
      const container = document.getElementById('appContainer');
      const urlParams = new URLSearchParams(window.location.search);
      const preselectedRoom = urlParams.get('room') || APP_STATE.rooms[0]?.roomCode || '';

      container.innerHTML = `
        <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
          <div class="text-center mb-6">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-cyan-500/10 text-cyan-300 border border-cyan-500/20 mb-2">
              THI TRẮC NGHIỆM TRỰC TUYẾN
            </span>
            <h1 class="text-2xl font-black text-slate-100">Đăng Ký Vào Phòng Thi</h1>
            <p class="text-xs text-slate-400 mt-1">Dữ liệu bài làm sẽ được lưu trực tiếp vào Google Sheets</p>
          </div>

          <div class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">HỌ VÀ TÊN THÍ SINH: *</label>
              <input type="text" id="candName" placeholder="Nhập họ và tên..." class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">BỘ PHẬN:</label>
                <select id="candUnit" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-100">
                  <option value="A">Nhà máy điện</option>
                  <option value="B">XSC cơ</option>
                  <option value="C">Trưởng ca</option>
                  <option value="D">XSC điện</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">BẬC DỰ THI:</label>
                <select id="candLevel" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-100">
                  <option value="2">Bậc 2</option>
                  <option value="3">Bậc 3</option>
                  <option value="4">Bậc 4</option>
                  <option value="5" selected>Bậc 5</option>
                  <option value="6">Bậc 6</option>
                  <option value="7">Bậc 7</option>
                  <option value="8">Bậc 8</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">CHỌN PHÒNG THI:</label>
              <select id="candRoom" onchange="handleRoomChange()" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-100 font-semibold">
                ${APP_STATE.rooms.map(r => `
                  <option value="${r.roomCode}" ${r.roomCode === preselectedRoom ? 'selected' : ''}>
                    [${r.roomCode}] ${r.roomName} (${r.examTimeMinutes}p) ${r.isLocked ? '🔒' : ''}
                  </option>
                `).join('')}
              </select>
            </div>

            <div id="pinBox" class="p-3.5 rounded-2xl bg-amber-500/10 border border-amber-500/30">
              <label class="block text-amber-300 font-bold text-xs mb-1">🔒 MÃ KHÓA PHÒNG THI (PIN):</label>
              <input type="password" id="candPin" placeholder="Nhập mã PIN..." class="w-full px-3 py-2 bg-slate-950 border border-amber-500/40 rounded-xl text-sm font-mono text-amber-300 focus:outline-none">
            </div>

            <div id="entryError" class="hidden text-xs text-rose-400 font-semibold p-2 bg-rose-500/10 rounded-lg border border-rose-500/30"></div>

            <button onclick="startExamAction()" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold text-sm shadow-xl shadow-cyan-500/25 active:scale-95 transition-all">
              BẮT ĐẦU LÀM BÀI THI
            </button>
          </div>
        </div>
      `;
      handleRoomChange();
      lucide.createIcons();
    }

    function handleRoomChange() {
      const roomSelect = document.getElementById('candRoom');
      const pinBox = document.getElementById('pinBox');
      if (!roomSelect || !pinBox) return;
      const room = APP_STATE.rooms.find(r => r.roomCode === roomSelect.value);
      if (room && room.isLocked) {
        pinBox.classList.remove('hidden');
      } else {
        pinBox.classList.add('hidden');
      }
    }

    function startExamAction() {
      const name = document.getElementById('candName').value.trim();
      const unit = document.getElementById('candUnit').value;
      const level = document.getElementById('candLevel').value;
      const roomCode = document.getElementById('candRoom').value;
      const pin = document.getElementById('candPin')?.value.trim() || '';
      const errorDiv = document.getElementById('entryError');

      if (!name) {
        errorDiv.innerText = 'Vui lòng nhập họ và tên thí sinh.';
        errorDiv.classList.remove('hidden');
        return;
      }

      const room = APP_STATE.rooms.find(r => r.roomCode === roomCode);
      if (room && room.isLocked && pin !== room.accessPin) {
        errorDiv.innerText = 'Mã khóa phòng thi (PIN) không chính xác!';
        errorDiv.classList.remove('hidden');
        return;
      }

      errorDiv.classList.add('hidden');
      APP_STATE.currentExam = {
        candidateName: name,
        unit: unit,
        unitName: unit === 'A' ? 'Nhà máy điện' : (unit === 'B' ? 'XSC cơ' : (unit === 'C' ? 'Trưởng ca' : 'XSC điện')),
        level: level,
        roomCode: roomCode,
        examCode: unit + Math.floor(100 + Math.random() * 900),
        examTimeMinutes: room ? room.examTimeMinutes : 60,
        questions: APP_STATE.questions.slice(0, room ? room.totalQuestions : 50)
      };

      APP_STATE.currentAnswers = {};
      APP_STATE.currentQuestionIndex = 0;
      APP_STATE.remainingSeconds = APP_STATE.currentExam.examTimeMinutes * 60;
      APP_STATE.focusViolations = 0;

      renderExamScreen();
    }

    // View 2: Exam Interface
    function renderExamScreen() {
      const exam = APP_STATE.currentExam;
      const q = exam.questions[APP_STATE.currentQuestionIndex];
      const container = document.getElementById('appContainer');

      container.innerHTML = `
        <div class="max-w-4xl w-full flex flex-col gap-4">
          <!-- Top bar -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-xl">
            <div>
              <span class="font-bold text-sm text-slate-100">${exam.candidateName}</span>
              <span class="text-xs text-slate-400 block">${exam.unitName} • Bậc ${exam.level} • Đề: ${exam.examCode}</span>
            </div>
            <div id="examTimer" class="px-3.5 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-cyan-400 font-mono font-bold text-base">
              ${formatTime(APP_STATE.remainingSeconds)}
            </div>
            <button onclick="submitExamAction()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-600/20">
              Nộp bài
            </button>
          </div>

          <!-- Question Card -->
          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex items-center justify-between text-xs text-slate-400 pb-3 border-b border-slate-800">
              <span class="font-bold text-cyan-400">Câu ${APP_STATE.currentQuestionIndex + 1} / ${exam.questions.length}</span>
              <span>Phần: ${q.section}</span>
            </div>

            <h2 class="text-base sm:text-lg font-bold text-slate-100 leading-relaxed">${q.question}</h2>

            <div class="space-y-2.5 pt-2">
              ${Object.entries(q.options).map(([key, text]) => {
                const isSelected = APP_STATE.currentAnswers[APP_STATE.currentQuestionIndex] === key;
                return `
                  <button onclick="selectAnswer('${key}')" class="w-full text-left p-3.5 rounded-xl border flex items-center gap-3 transition-all ${
                    isSelected ? 'bg-cyan-500/20 border-cyan-500 text-cyan-100 font-bold ring-1 ring-cyan-500' : 'bg-slate-800/60 border-slate-800 hover:bg-slate-800 text-slate-300'
                  }">
                    <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold ${
                      isSelected ? 'bg-cyan-500 text-slate-950 font-black' : 'bg-slate-700 text-slate-300'
                    }">${key}</span>
                    <span class="text-sm">${text}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Nav controls -->
          <div class="flex items-center justify-between bg-slate-900 p-3 rounded-2xl border border-slate-800">
            <button onclick="prevQuestion()" ${APP_STATE.currentQuestionIndex === 0 ? 'disabled class="opacity-40 px-4 py-2 text-xs font-bold"' : 'class="px-4 py-2 bg-slate-800 rounded-xl text-xs font-bold hover:bg-slate-700"'}>
              ◀ Câu trước
            </button>
            <span class="text-xs text-slate-400">Đã trả lời: ${Object.keys(APP_STATE.currentAnswers).length}/${exam.questions.length}</span>
            <button onclick="nextQuestion()" ${APP_STATE.currentQuestionIndex === exam.questions.length - 1 ? 'disabled class="opacity-40 px-4 py-2 text-xs font-bold"' : 'class="px-4 py-2 bg-slate-800 rounded-xl text-xs font-bold hover:bg-slate-700"'}>
              Câu tiếp ▶
            </button>
          </div>
        </div>
      `;

      if (!APP_STATE.timerInterval) {
        APP_STATE.timerInterval = setInterval(function() {
          APP_STATE.remainingSeconds--;
          const timerEl = document.getElementById('examTimer');
          if (timerEl) timerEl.innerText = formatTime(APP_STATE.remainingSeconds);
          if (APP_STATE.remainingSeconds <= 0) {
            clearInterval(APP_STATE.timerInterval);
            APP_STATE.timerInterval = null;
            submitExamAction(true);
          }
        }, 1000);
      }

      lucide.createIcons();
    }

    function selectAnswer(letter) {
      APP_STATE.currentAnswers[APP_STATE.currentQuestionIndex] = letter;
      renderExamScreen();
    }
    function prevQuestion() {
      if (APP_STATE.currentQuestionIndex > 0) {
        APP_STATE.currentQuestionIndex--;
        renderExamScreen();
      }
    }
    function nextQuestion() {
      if (APP_STATE.currentQuestionIndex < APP_STATE.currentExam.questions.length - 1) {
        APP_STATE.currentQuestionIndex++;
        renderExamScreen();
      }
    }

    function submitExamAction(isAuto) {
      if (!isAuto && !confirm('Bạn chắc chắn muốn nộp bài thi?')) return;
      if (APP_STATE.timerInterval) {
        clearInterval(APP_STATE.timerInterval);
        APP_STATE.timerInterval = null;
      }

      const exam = APP_STATE.currentExam;
      let correct = 0;
      exam.questions.forEach((q, i) => {
        if (APP_STATE.currentAnswers[i] === q.correct) correct++;
      });

      const total = exam.questions.length;
      const score = Number(((correct * 10) / (total || 1)).toFixed(2));
      const elapsed = (exam.examTimeMinutes * 60) - APP_STATE.remainingSeconds;

      const attemptResult = {
        candidateName: exam.candidateName,
        unit: exam.unit,
        unitName: exam.unitName,
        level: exam.level,
        roomCode: exam.roomCode,
        examCode: exam.examCode,
        score: score,
        correct: correct,
        total: total,
        elapsedSeconds: elapsed,
        status: isAuto ? 'TỰ ĐỘNG NỘP - HẾT GIỜ' : 'ĐÃ NỘP BÀI',
        focusViolations: APP_STATE.focusViolations
      };

      // Save to Google Sheets if running in Apps Script
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.apiSubmitExam(attemptResult);
      }

      APP_STATE.candidates.unshift(attemptResult);
      renderResultScreen(attemptResult);
    }

    // View 3: Result View
    function renderResultScreen(res) {
      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 text-center shadow-2xl space-y-4">
          <div class="w-16 h-16 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-2xl font-black">
            ✓
          </div>
          <h2 class="text-xl font-black text-slate-100">KẾT QUẢ BÀI THI</h2>
          <p class="text-xs text-slate-400">${res.candidateName} • ${res.unitName} • Bậc ${res.level}</p>

          <div class="py-4 border-y border-slate-800">
            <span class="text-5xl font-black text-emerald-400">${res.score}</span>
            <span class="text-slate-400 text-lg">/ 10</span>
            <p class="text-xs text-slate-400 mt-2">Số câu đúng: <strong class="text-emerald-400">${res.correct}/${res.total}</strong></p>
          </div>

          <p class="text-xs text-emerald-400 bg-emerald-500/10 py-2 rounded-xl border border-emerald-500/20">
            ✓ Đã lưu kết quả trực tiếp vào Google Sheets
          </p>

          <button onclick="renderCandidatePortal()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs">
            Về trang chủ
          </button>
        </div>
      `;
    }

    // View 4: Admin Portal (Google Apps Script Version)
    function renderAdminPortal() {
      const container = document.getElementById('appContainer');
      document.getElementById('btnAdminLogin').classList.add('hidden');
      document.getElementById('btnExitAdmin').classList.remove('hidden');

      container.innerHTML = `
        <div class="w-full space-y-6">
          <div class="flex items-center justify-between pb-4 border-b border-slate-800">
            <div>
              <h2 class="text-xl font-black text-slate-100">Bảng Quản Trị Google Apps Script</h2>
              <p class="text-xs text-slate-400">Kết nối trực tiếp dữ liệu Google Sheets của bạn</p>
            </div>
            <button onclick="syncGoogleSheets()" class="px-3.5 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs shadow-md">
              Đồng bộ Sheets
            </button>
          </div>

          <!-- Room Cards -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${APP_STATE.rooms.map(r => `
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-2">
                <div class="flex items-center justify-between">
                  <span class="font-mono font-bold text-cyan-400">${r.roomCode}</span>
                  <span class="text-xs font-bold px-2 py-0.5 rounded-lg ${r.isLocked ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'}">
                    ${r.isLocked ? 'ĐANG KHÓA (PIN: ' + r.accessPin + ')' : 'MỞ TỰ DO'}
                  </span>
                </div>
                <h4 class="font-bold text-slate-200">${r.roomName}</h4>
                <p class="text-xs text-slate-400">${r.examTimeMinutes} phút • ${r.totalQuestions} câu</p>
              </div>
            `).join('')}
          </div>

          <!-- Candidates List -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
            <h3 class="font-bold text-sm text-slate-200 mb-3">Danh Sách Bài Thi (Cập nhật từ Google Sheet THI_SINH)</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="text-slate-400 border-b border-slate-800">
                  <tr>
                    <th class="py-2">Thí sinh</th>
                    <th>Bộ phận</th>
                    <th>Phòng</th>
                    <th>Điểm</th>
                    <th>Trạng thái</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
                  ${APP_STATE.candidates.length === 0 ? '<tr><td colspan="5" class="py-4 text-center text-slate-500">Chưa có bài thi nào</td></tr>' : APP_STATE.candidates.map(c => `
                    <tr>
                      <td class="py-2 font-bold text-slate-200">${c.fullName || c.candidateName}</td>
                      <td>${c.unitName || c.unit}</td>
                      <td>${c.roomCode}</td>
                      <td class="font-bold text-emerald-400">${c.score !== undefined ? c.score : '—'}</td>
                      <td>${c.status}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
    }
    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }
    function checkAdminPassword() {
      const pass = document.getElementById('adminPasswordInput').value;
      if (pass === 'admin') {
        closeAdminModal();
        APP_STATE.isAdmin = true;
        renderAdminPortal();
      } else {
        document.getElementById('adminError').classList.remove('hidden');
      }
    }
    function exitAdminView() {
      APP_STATE.isAdmin = false;
      document.getElementById('btnAdminLogin').classList.remove('hidden');
      document.getElementById('btnExitAdmin').classList.add('hidden');
      renderCandidatePortal();
    }

    function syncGoogleSheets() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(data) {
            alert('Đã đồng bộ thành công với Google Sheets!');
            if (data.candidates) APP_STATE.candidates = data.candidates;
            renderAdminPortal();
          })
          .apiGetInitialData();
      } else {
        alert('Đang chạy ở chế độ xem trước (preview). Khi triển khai trên Google Apps Script, nút này sẽ đồng bộ trực tiếp với Google Sheets!');
      }
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
  </script>
</body>
</html>
